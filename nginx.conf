# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# HTTPS server
server {
    listen 443 ssl;
    server_name thiagohatanaka.site www.thiagohatanaka.site;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/thiagohatanaka.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thiagohatanaka.site/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        proxy_hide_header X-Powered-By;
    }

    location /healthz {
        proxy_pass http://backend:3001;
    }

    client_max_body_size 25m;

    # ES modules MIME type
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
