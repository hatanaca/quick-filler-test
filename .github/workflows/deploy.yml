name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 6060 -H 200.158.242.69 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          SSH_USER="ThiagoHatanaka"
          DEPLOY_HOST="200.158.242.69"
          SSH_PORT="6060"
          APP_DIR="/opt/quick-filler-test"

          SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/deploy_key $SSH_USER@$DEPLOY_HOST"

          echo "📤 Syncing files to server..."
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'uploads' \
            --exclude 'coverage' \
            --exclude 'output' \
            --exclude '.env' \
            . "$SSH_USER@$DEPLOY_HOST:$APP_DIR"

          echo "🔧 Deploying on server..."
          $SSH_CMD << 'DEPLOY_SCRIPT'
            cd /opt/quick-filler-test
            
            # Generate JWT_SECRET if not exists
            if [ ! -f .env ] || ! grep -q "JWT_SECRET=" .env; then
              echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env
              echo "✅ JWT_SECRET generated"
            fi
            
            # Build and deploy
            docker compose build
            docker compose up -d
            
            # Wait for health check
            echo "⏳ Waiting for backend health..."
            for i in {1..30}; do
              if docker compose exec backend wget -qO- http://127.0.0.1:3001/healthz > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              fi
              sleep 2
            done
            
            # Show status
            docker compose ps
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10

          # Check if services are responding (via gateway)
          if curl -sf "https://200.158.242.69" > /dev/null 2>&1; then
            echo "✅ Frontend is accessible via gateway"
          else
            echo "⚠️  Frontend check failed (gateway may use different port)"
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/deploy_key
