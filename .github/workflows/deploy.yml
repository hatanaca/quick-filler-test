name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          APP_DIR="/opt/quick-filler-test"

          SSH_CMD="ssh -p $SSH_PORT $SSH_USER@$DEPLOY_HOST"

          echo "Syncing files to server..."
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'uploads' \
            --exclude 'coverage' \
            --exclude 'output' \
            --exclude '.env' \
            . "$SSH_USER@$DEPLOY_HOST:$APP_DIR"

          echo "Deploying on server..."
          $SSH_CMD << 'DEPLOY_SCRIPT'
            cd /opt/quick-filler-test
            
            # Generate JWT_SECRET if not exists
            if [ ! -f .env ] || ! grep -q "JWT_SECRET=" .env; then
              echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env
              echo "JWT_SECRET generated"
            fi
            
            # Build and deploy
            docker compose build
            docker compose up -d
            
            # Wait for health check
            echo "Waiting for backend health..."
            for i in {1..30}; do
              if docker compose exec backend wget -qO- http://127.0.0.1:3001/healthz > /dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              sleep 2
            done
            
            # Show status
            docker compose ps
          DEPLOY_SCRIPT

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Verifying deployment..."
          sleep 10

          # Check if services are responding (via gateway)
          if curl -sf "https://$DEPLOY_HOST" > /dev/null 2>&1; then
            echo "Frontend is accessible via gateway"
          else
            echo "Frontend check failed (gateway may use different port)"
          fi
