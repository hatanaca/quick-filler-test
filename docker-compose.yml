services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      UPLOAD_MAX_SIZE_MB: 20
      UPLOAD_MAX_CONCURRENT_PER_IP: 3
      PROCESSING_TIMEOUT_MS: 60000
      RETENTION_MINUTES: 60
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      RATE_LIMIT_MAX: 300
      RATE_LIMIT_WINDOW_MS: 60000
      TESSERACT_LANG: por
      OCR_WORKER_POOL_SIZE: 2
      PDF_RENDER_SCALE: 4
      OCR_CONFIDENCE_THRESHOLD: 40
      OCR_PREPROCESS: auto
      OCR_PSM: 6
      OCR_WHITELIST: ''
      # nginx conecta ao backend pela rede Docker (não-loopback); confiar na
      # sub-rede do proxy é necessário para rate limit/fila verem o IP real.
      # 172.16.0.0/12 cobre as redes bridge padrão do Docker.
      TRUST_PROXY: loopback,172.16.0.0/12
      # JWT Secret (REQUIRED in production)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - '127.0.0.1:5173:80'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
  letsencrypt:
