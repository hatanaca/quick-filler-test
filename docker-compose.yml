services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - '0.0.0.0:3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      UPLOAD_MAX_SIZE_MB: 20
      UPLOAD_MAX_CONCURRENT_PER_IP: 3
      PROCESSING_TIMEOUT_MS: 60000
      RETENTION_MINUTES: 60
      CORS_ORIGIN: ${CORS_ORIGIN:-https://thiagohatanaka.site}
      RATE_LIMIT_MAX: 300
      RATE_LIMIT_WINDOW_MS: 60000
      TESSERACT_LANG: por
      OCR_WORKER_POOL_SIZE: 2
      PDF_RENDER_SCALE: 5
      OCR_CONFIDENCE_THRESHOLD: 60
      OCR_PREPROCESS: auto
      OCR_PSM: 6
      OCR_WHITELIST: ''
      TRUST_PROXY: loopback,172.16.0.0/12
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USER_EMAIL: ${USER_EMAIL:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - '0.0.0.0:443:443'
    environment:
      DOMAIN: ${DOMAIN:-thiagohatanaka.site}
    volumes:
      - ./letsencrypt/etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./letsencrypt/etc/letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  uploads:
